<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0f2f5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" content="Biblioteca de respuestas y plantillas para la atención UCAL.">
<title>UCAL PRO | Centro de atención</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#202a35;--muted:#7a8793;--line:#dfe5eb;--blue:#2581b8;--blue-dark:#176b9f;--green:#20b978;--orange:#ed9b32;--shadow:0 2px 5px rgba(22,39,55,.08),0 1px 2px rgba(22,39,55,.05);--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2581b844;outline-offset:2px}
.toolbar{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:1px solid #e0e5ea;box-shadow:0 2px 8px #1b33400a;z-index:5}
.brand{font-size:17px;line-height:1;font-weight:950;letter-spacing:-.7px;color:#17232d;white-space:nowrap}
.brand span{color:#2682b9}
.search-wrap{position:relative;width:min(410px,34vw);margin-left:2px}
.search-wrap input{width:100%;height:38px;border:1px solid #dce2e9;background:#f4f6f8;border-radius:22px;padding:0 112px 0 38px;font-size:12px;color:#263746;transition:.18s}
.search-wrap input::placeholder{color:#7f8b98}
.search-wrap input:focus{outline:0;border-color:#8bbbd6;background:#fff;box-shadow:0 0 0 3px #2581b814}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8b99a5;font-size:16px;pointer-events:none}
.search-tip{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#3988b8;font-size:10px;white-space:nowrap;pointer-events:none}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;border:1px solid #e7ecef;background:#fafbfc;border-radius:20px;padding:7px 12px;font-size:10px;color:#687783;white-space:nowrap}
.led{width:9px;height:9px;border-radius:50%;background:#aab5bd}
.led.saved{background:#20c77b;box-shadow:0 0 6px #20c77b77}
.led.pending{background:#e99a32;box-shadow:0 0 6px #e99a3277}
.led.error{background:#e35454;box-shadow:0 0 6px #e3545477}
.btn{height:37px;border:1px solid transparent;border-radius:8px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:780;white-space:nowrap;transition:transform .16s,background .16s,box-shadow .16s}
.btn:hover{transform:translateY(-1px)}
.btn-icon{width:48px;padding:0;background:#65717b;color:#fff;font-size:16px;box-shadow:0 2px 5px #27364020}
.btn-save{background:#fff;color:#3e4b55;border-color:#dce2e8;box-shadow:0 2px 4px #2035430d}
.btn-save:hover{background:#f8fafb}
.btn-lock{background:linear-gradient(135deg,#2789bd,#176b9e);color:#fff;box-shadow:0 3px 8px #1774a533;min-width:112px}
.btn-lock.editing{background:linear-gradient(135deg,#e99b36,#d77820);box-shadow:0 3px 8px #d7782033}
.btn-new{display:none;background:#1f9a83;color:#fff}
body.editing .btn-new{display:inline-flex}
main{flex:1;min-height:0;overflow:auto;padding:12px 18px 30px}
.dashboard-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(180px,auto);gap:13px}
.card{position:relative;border-radius:var(--radius);padding:15px 15px 28px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);cursor:pointer;transition:transform .18s,box-shadow .18s;user-select:text;overflow:hidden;min-width:0;min-height:180px;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(22,39,55,.13);z-index:2}
.card:active{transform:translateY(0)}
.card-label{font-size:10px;line-height:1.25;font-weight:850;letter-spacing:.15px;margin:0 0 7px;opacity:.72;text-transform:uppercase;overflow-wrap:anywhere}
.card-content{font-size:11px;line-height:1.45;font-weight:650;white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.card-category{position:absolute;bottom:9px;left:15px;font-size:9px;font-weight:700;opacity:.5;max-width:calc(100% - 72px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-actions{position:absolute;right:8px;bottom:6px;display:none;gap:4px;z-index:3}
body.editing .card-actions{display:flex}
.card-tool{width:24px;height:24px;border:0;border-radius:50%;background:#ffffffdd;color:#34434b;box-shadow:0 1px 4px #00000020;display:grid;place-items:center;font-size:12px}
.card-tool:hover{background:#fff;transform:scale(1.08)}
.card.dragging{opacity:.4;transform:scale(.98)}
.card.drag-over{outline:2px dashed #2386b7;outline-offset:2px}
.c-blue{background:linear-gradient(135deg,#e2f1ff,#bfdef9);color:#1457a3}
.c-green{background:linear-gradient(135deg,#e8f7e9,#c8e7cb);color:#236b32}
.c-purple{background:linear-gradient(135deg,#f2e4f6,#e2c6eb);color:#63309b}
.c-orange{background:linear-gradient(135deg,#fff1d9,#ffe0b3);color:#c95b08}
.c-red{background:linear-gradient(135deg,#ffedef,#ffd1d7);color:#c52d35}
.c-gray{background:linear-gradient(135deg,#fff,#f0f2f4);color:#4a5d6a}
.c-teal{background:linear-gradient(135deg,#e0f5f1,#b7e5dc);color:#087868}
.c-pink{background:linear-gradient(135deg,#fce6ee,#f6c4d7);color:#a61d5a}
.c-indigo{background:linear-gradient(135deg,#e9eafd,#cbd0f1);color:#343e91}
.c-lime{background:linear-gradient(135deg,#f7fbe7,#deedc4);color:#5c7925}
.c-amber{background:linear-gradient(135deg,#fff8e5,#ffe7a8);color:#93610c}
.c-brown{background:linear-gradient(135deg,#f2ebe7,#d9c8bd);color:#644333}
.c-dark{background:linear-gradient(135deg,#35444b,#20282c);color:#fff}
.c-purple-dark{background:linear-gradient(135deg,#4d1d93,#31167e);color:#fff}
.c-lavender{background:linear-gradient(135deg,#f0eafa,#d7c8ef);color:#573b91}
.new-template{display:none;min-height:180px;border:2px dashed #b9c7cf;background:#f8fafb;border-radius:var(--radius);color:#758792;place-items:center;align-content:center;gap:9px;font-size:12px;font-weight:750;transition:.18s}
body.editing .new-template{display:grid}
.new-template:hover{background:#fff;border-color:#4c9cc3;color:#247eaa}
.new-template .plus{font-size:27px;font-weight:300;line-height:1}
.empty-state{grid-column:1/-1;min-height:380px;display:grid;place-content:center;text-align:center;color:#788893}
.empty-state strong{font-size:16px;color:#40515c;margin-bottom:7px}
.empty-state span{font-size:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:#24333c;color:#fff;padding:11px 18px;border-radius:30px;font-size:11px;font-weight:700;box-shadow:0 8px 22px #20344133;opacity:0;pointer-events:none;transition:.22s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{display:none;position:fixed;inset:0;z-index:20;background:#18283275;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{width:min(590px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid #e1e7eb;border-radius:17px;box-shadow:0 20px 65px #132b3c40;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-header{display:flex;align-items:flex-start;gap:12px;padding:21px 23px 16px;border-bottom:1px solid #edf0f2}
.modal-heading{flex:1}
.modal-header h2{font-size:17px;margin:0;color:#25343c}
.modal-header p{font-size:11px;color:#85919a;margin:5px 0 0}
.close{width:30px;height:30px;border:0;border-radius:8px;background:#f0f3f5;color:#64727b;font-size:17px}
.modal-body{padding:19px 23px 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;color:#52616a;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid #dce3e8;border-radius:8px;padding:10px 11px;font-size:12px;color:#283943;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:#75afd0;box-shadow:0 0 0 3px #2684b71a}
.field textarea{min-height:180px;resize:vertical;line-height:1.55}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.palette{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.swatch{width:27px;height:27px;border-radius:50%;border:2px solid #ffffff;box-shadow:0 0 0 1px #d3dce1;cursor:pointer;position:relative}
.swatch.selected{box-shadow:0 0 0 2px #2585b8}
.swatch.selected:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#283943;font-size:13px;font-weight:900}
.modal-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 23px 18px;border-top:1px solid #edf0f2;background:#fafbfc}
.hint{font-size:10px;color:#8b989f}
.footer-actions{display:flex;gap:8px}
.modal-btn{height:35px;padding:0 14px;border-radius:8px;border:1px solid #dce3e8;background:#fff;color:#586873;font-size:11px;font-weight:750}
.modal-btn.primary{background:#2581b8;border-color:#2581b8;color:white}
@media(max-width:1500px){.dashboard-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:1200px){.dashboard-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.toolbar{padding:0 15px}.search-wrap{width:min(350px,30vw)}}
@media(max-width:900px){body{overflow:hidden}.dashboard-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(165px,auto)}.status{display:none}.brand{font-size:15px}.toolbar{gap:9px}.search-wrap{flex:1;width:auto}.card{min-height:165px}}
@media(max-width:650px){.toolbar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 12px;gap:8px}.brand{width:100%;font-size:15px}.search-wrap{order:2;width:100%;flex-basis:100%}.spacer{display:none}.btn{height:34px;padding:0 10px;font-size:10px}.btn-icon{width:38px}.btn-new{margin-left:auto}.btn-lock{min-width:95px}main{padding:11px 10px 25px}.dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;grid-auto-rows:minmax(158px,auto)}.card{padding:12px 12px 27px;min-height:158px}.card-content{font-size:10.5px}.card-category{left:12px}.new-template{min-height:158px}.two-fields{grid-template-columns:1fr;gap:0}.modal-header{padding:18px 18px 14px}.modal-body{padding:16px 18px}.modal-footer{padding:12px 18px}.hint{display:none}.footer-actions{margin-left:auto}}
@media(max-width:380px){.dashboard-grid{grid-template-columns:1fr}.card{min-height:130px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand">UCAL<span>PRO</span></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="searchInput" type="search" placeholder="Filtrar respuestas..." autocomplete="off" aria-label="Filtrar respuestas">
    <span class="search-tip">Ctrl + F / ESC</span>
  </div>
  <div class="spacer"></div>
  <div class="status" title="Estado del almacenamiento en este navegador"><span class="led saved" id="statusLed"></span><span id="statusLabel">Guardado</span></div>
  <button class="btn btn-icon" id="backupBtn" type="button" title="Descargar copia de seguridad" aria-label="Descargar copia de seguridad">💾</button>
  <button class="btn btn-save" id="saveBtn" type="button">☁ Guardar</button>
  <button class="btn btn-lock" id="editBtn" type="button">Bloqueado</button>
  <button class="btn btn-new" id="newBtn" type="button">＋ Nueva plantilla</button>
</header>

<main>
  <section class="dashboard-grid" id="grid" aria-label="Plantillas de atención"></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="editorOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <section class="modal">
    <div class="modal-header">
      <div class="modal-heading">
        <h2 id="modalTitle">Añadir texto</h2>
        <p>Pega o escribe la respuesta que deseas copiar. No necesitas completar ningún otro dato.</p>
      </div>
      <button class="close" id="closeModal" type="button" aria-label="Cerrar">×</button>
    </div>
    <form id="templateForm">
      <div class="modal-body">
        <input type="hidden" id="templateId">
        <div class="field">
          <label for="templateContent">Texto para copiar</label>
          <textarea id="templateContent" required autofocus placeholder="Escribe o pega aquí tu respuesta..."></textarea>
        </div>
        <div class="field">
          <div class="color-label">
            <label style="margin:0">Color de la tarjeta</label>
            <span class="hint" id="selectedColorName">Azul</span>
          </div>
          <div class="palette" id="colorPalette" aria-label="Elegir color de tarjeta"></div>
        </div>
      </div>
      <div class="modal-footer">
        <span class="hint">El texto se copiará exactamente como lo escribas.</span>
        <div class="footer-actions">
          <button class="modal-btn" id="cancelBtn" type="button">Cancelar</button>
          <button class="modal-btn primary" type="submit">Guardar plantilla</button>
        </div>
      </div>
    </form>
  </section>
</div>

<script>
(() => {
  "use strict";
  const STORAGE_KEY = "ucal_attention_templates_v1";
  const colors = [
    {id:"c-blue",name:"Azul",bg:"linear-gradient(135deg,#e2f1ff,#bfdef9)"},
    {id:"c-green",name:"Verde",bg:"linear-gradient(135deg,#e8f7e9,#c8e7cb)"},
    {id:"c-purple",name:"Lila",bg:"linear-gradient(135deg,#f2e4f6,#e2c6eb)"},
    {id:"c-orange",name:"Naranja",bg:"linear-gradient(135deg,#fff1d9,#ffe0b3)"},
    {id:"c-red",name:"Rojo",bg:"linear-gradient(135deg,#ffedef,#ffd1d7)"},
    {id:"c-gray",name:"Gris",bg:"linear-gradient(135deg,#fff,#f0f2f4)"},
    {id:"c-teal",name:"Turquesa",bg:"linear-gradient(135deg,#e0f5f1,#b7e5dc)"},
    {id:"c-pink",name:"Rosa",bg:"linear-gradient(135deg,#fce6ee,#f6c4d7)"},
    {id:"c-indigo",name:"Índigo",bg:"linear-gradient(135deg,#e9eafd,#cbd0f1)"},
    {id:"c-lime",name:"Lima",bg:"linear-gradient(135deg,#f7fbe7,#deedc4)"},
    {id:"c-amber",name:"Ámbar",bg:"linear-gradient(135deg,#fff8e5,#ffe7a8)"},
    {id:"c-brown",name:"Marrón",bg:"linear-gradient(135deg,#f2ebe7,#d9c8bd)"},
    {id:"c-dark",name:"Oscuro",bg:"linear-gradient(135deg,#35444b,#20282c)"},
    {id:"c-purple-dark",name:"Morado oscuro",bg:"linear-gradient(135deg,#4d1d93,#31167e)"},
    {id:"c-lavender",name:"Lavanda",bg:"linear-gradient(135deg,#f0eafa,#d7c8ef)"}
  ];
  const $ = id => document.getElementById(id);
  let templates = loadTemplates();
  let editing = false;
  let selectedColor = "c-blue";
  let draggedId = null;
  let toastTimer = null;

  function loadTemplates(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const data = JSON.parse(raw);
      if(!Array.isArray(data)) return [];
      return data.filter(item => item && typeof item === "object" && item.id && item.id !== "demo-1" && item.content !== undefined)
        .map((item,index) => ({
          id:String(item.id),
          title:String(item.title || ""),
          category:String(item.category || ""),
          channel:String(item.channel || "Todos"),
          content:String(item.content || ""),
          color:colors.some(color => color.id === item.color) ? item.color : colors[index % colors.length].id,
          favorite:!!item.favorite,
          createdAt:Number(item.createdAt) || Date.now(),
          updatedAt:Number(item.updatedAt) || Number(item.createdAt) || Date.now()
        }));
    }catch(error){console.error("Error al cargar las plantillas",error);return [];}
  }
  function setStatus(state,label){
    $("statusLed").className = "led " + state;
    $("statusLabel").textContent = label;
  }
  function saveData(showMessage){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(templates));
      setStatus("saved","Guardado");
      if(showMessage) showToast("Cambios guardados en este navegador.");
      return true;
    }catch(error){
      setStatus("error","Error al guardar");
      showToast("No se pudo guardar. Descarga un respaldo y libera espacio.");
      return false;
    }
  }
  function renderPalette(){
    $("colorPalette").innerHTML = colors.map(color =>
      '<button type="button" class="swatch '+(selectedColor===color.id?"selected":"")+'" data-color="'+color.id+'" title="'+color.name+'" aria-label="Elegir color '+color.name+'" aria-pressed="'+(selectedColor===color.id)+'" style="background:'+color.bg+'"></button>'
    ).join("");
    const selected = colors.find(color => color.id === selectedColor);
    $("selectedColorName").textContent = selected ? selected.name : "Azul";
  }
  function showToast(message){
    const element = $("toast");
    element.textContent = message;
    element.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => element.classList.remove("show"),2200);
  }
  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g,char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
  }
  function colorName(id){
    const color = colors.find(item => item.id === id);
    return color ? color.name : "Azul";
  }
  function cardHtml(item){
    const tools = '<div class="card-actions">'+
      '<button class="card-tool" type="button" data-action="edit" data-id="'+escapeHtml(item.id)+'" title="Editar">✎</button>'+
      '<button class="card-tool" type="button" data-action="delete" data-id="'+escapeHtml(item.id)+'" title="Eliminar">×</button>'+
    '</div>';
    return '<article class="card '+escapeHtml(item.color)+'" data-id="'+escapeHtml(item.id)+'" draggable="'+(editing?"true":"false")+'" tabindex="0" role="button" aria-label="'+(editing?"Editar plantilla":"Copiar texto")+'">'+
      '<div class="card-content">'+escapeHtml(item.content)+'</div>'+tools+'</article>';
  }
  function render(){
    const query = $("searchInput").value.trim().toLocaleLowerCase("es");
    const filtered = templates.filter(item => {
      if(!query) return true;
      return [item.title,item.category,item.channel,item.content].join(" ").toLocaleLowerCase("es").includes(query);
    });
    $("grid").innerHTML = filtered.map(cardHtml).join("") + (editing ?
      '<button class="new-template" type="button" id="addCard"><span class="plus">＋</span><span>Agregar plantilla</span></button>' : "");
    const add = $("addCard");
    if(add) add.addEventListener("click",() => openEditor());
    if(!filtered.length && !editing){
      $("grid").innerHTML = '<div class="empty-state"><strong>'+(templates.length?"No se encontraron respuestas":"Aún no tienes plantillas registradas")+'</strong><span>'+(templates.length?"Prueba con otra palabra para filtrar.":"Activa el modo de edición para agregar tu primera plantilla.")+'</span></div>';
    }
  }
  function setEditing(value){
    editing = value;
    document.body.classList.toggle("editing",editing);
    $("editBtn").textContent = editing ? "Edición activa" : "Bloqueado";
    $("editBtn").classList.toggle("editing",editing);
    $("editBtn").setAttribute("aria-pressed",String(editing));
    render();
    if(editing) showToast("Modo de edición activado.");
    else showToast("Edición bloqueada.");
  }
  function openEditor(item){
    $("templateForm").reset();
    $("templateId").value = item ? item.id : "";
    $("modalTitle").textContent = item ? "Editar texto" : "Añadir texto";
    $("templateContent").value = item ? item.content : "";
    selectedColor = item ? (colors.some(color => color.id === item.color) ? item.color : "c-blue") : colors[templates.length % colors.length].id;
    renderPalette();
    $("editorOverlay").classList.add("open");
    setTimeout(()=>$("templateContent").focus(),30);
  }
  function closeEditor(){$("editorOverlay").classList.remove("open");}
  async function copyText(value){
    try{
      if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
      else{
        const area=document.createElement("textarea");
        area.value=value;area.style.position="fixed";area.style.opacity="0";
        document.body.appendChild(area);area.select();
        const ok=document.execCommand("copy");area.remove();
        if(!ok) throw new Error("Copy failed");
      }
      showToast("Respuesta copiada.");
    }catch(error){showToast("No se pudo copiar automáticamente.");}
  }
  function downloadBackup(){
    const blob = new Blob([JSON.stringify(templates,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href=url;link.download="respaldo-plantillas-ucal.json";
    document.body.appendChild(link);link.click();link.remove();
    URL.revokeObjectURL(url);
    showToast("Copia de seguridad descargada.");
  }

  $("colorPalette").addEventListener("click",event=>{
    const swatch = event.target.closest("[data-color]");
    if(!swatch) return;
    selectedColor = swatch.dataset.color;
    renderPalette();
  });
  $("editBtn").addEventListener("click",()=>setEditing(!editing));
  $("newBtn").addEventListener("click",()=>{if(editing)openEditor();});
  $("saveBtn").addEventListener("click",()=>saveData(true));
  $("backupBtn").addEventListener("click",downloadBackup);
  $("searchInput").addEventListener("input",render);
  $("closeModal").addEventListener("click",closeEditor);
  $("cancelBtn").addEventListener("click",closeEditor);
  $("editorOverlay").addEventListener("click",event=>{if(event.target===$("editorOverlay"))closeEditor();});
  $("templateForm").addEventListener("submit",event=>{
    event.preventDefault();
    if(!editing){showToast("Activa el modo de edición para modificar plantillas.");return;}
    const id=$("templateId").value;
    const previous=templates.find(item=>item.id===id);
    const content=$("templateContent").value.trim();
    if(!content){showToast("Escribe el texto de la plantilla.");return;}
    const now=Date.now();
    const item={
      id:previous?previous.id:(crypto.randomUUID?crypto.randomUUID():"tpl-"+now+"-"+Math.random().toString(36).slice(2)),
      title:previous ? previous.title : "",
      category:previous ? previous.category : "",
      channel:previous ? previous.channel : "Todos",
      content,
      color:previous ? previous.color : selectedColor,
      favorite:previous?previous.favorite:false,
      createdAt:previous?previous.createdAt:now,
      updatedAt:now
    };
    if(previous)templates=templates.map(entry=>entry.id===id?item:entry);
    else templates.push(item);
    if(saveData(false)){closeEditor();render();showToast(previous?"Plantilla actualizada.":"Plantilla agregada.");}
  });
  $("grid").addEventListener("click",event=>{
    const tool=event.target.closest("[data-action]");
    const card=event.target.closest(".card");
    if(tool){
      event.stopPropagation();
      const item=templates.find(entry=>entry.id===tool.dataset.id);
      if(!item)return;
      if(tool.dataset.action==="edit" && editing)openEditor(item);
      if(tool.dataset.action==="delete" && editing && confirm("¿Eliminar esta plantilla?")){
        templates=templates.filter(entry=>entry.id!==item.id);
        if(saveData(false)){render();showToast("Plantilla eliminada.");}
      }
      return;
    }
    if(card){
      const item=templates.find(entry=>entry.id===card.dataset.id);
      if(!item)return;
      if(editing)openEditor(item);
      else copyText(item.content);
    }
  });
  $("grid").addEventListener("keydown",event=>{
    if(event.key!=="Enter" && event.key!==" ")return;
    const card=event.target.closest(".card");
    if(!card || event.target.closest("button"))return;
    event.preventDefault();
    const item=templates.find(entry=>entry.id===card.dataset.id);
    if(!item)return;
    if(editing)openEditor(item);else copyText(item.content);
  });
  $("grid").addEventListener("dragstart",event=>{
    const card=event.target.closest(".card");
    if(!editing || !card){event.preventDefault();return;}
    draggedId=card.dataset.id;
    card.classList.add("dragging");
    event.dataTransfer.effectAllowed="move";
  });
  $("grid").addEventListener("dragover",event=>{
    if(!editing)return;
    const target=event.target.closest(".card");
    if(!target || target.dataset.id===draggedId)return;
    event.preventDefault();
    document.querySelectorAll(".card.drag-over").forEach(item=>item.classList.remove("drag-over"));
    target.classList.add("drag-over");
  });
  $("grid").addEventListener("drop",event=>{
    if(!editing || !draggedId)return;
    const target=event.target.closest(".card");
    if(!target || target.dataset.id===draggedId)return;
    event.preventDefault();
    const from=templates.findIndex(item=>item.id===draggedId);
    const to=templates.findIndex(item=>item.id===target.dataset.id);
    if(from<0||to<0)return;
    const moved=templates.splice(from,1)[0];
    templates.splice(to,0,moved);
    saveData(false);render();showToast("Orden de tarjetas actualizado.");
  });
  $("grid").addEventListener("dragend",()=>{
    draggedId=null;
    document.querySelectorAll(".card.dragging,.card.drag-over").forEach(item=>item.classList.remove("dragging","drag-over"));
  });
  window.addEventListener("keydown",event=>{
    if((event.ctrlKey||event.metaKey) && event.key.toLowerCase()==="f"){
      event.preventDefault();$("searchInput").focus();
    }
    if((event.ctrlKey||event.metaKey) && event.key.toLowerCase()==="s"){
      event.preventDefault();saveData(true);
    }
    if(event.key==="Escape"){
      if($("editorOverlay").classList.contains("open"))closeEditor();
      else{$("searchInput").value="";render();}
    }
  });
  render();
  setStatus("saved","Guardado");
})();
</script>
</body>
</html>
